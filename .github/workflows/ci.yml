name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Tauri and AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file fuse libfuse2 libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            squashfs-tools wget
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles appimage
      - uses: actions/upload-artifact@v4
        with:
          name: quelldock-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
